<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="764" viewBox="0 0 1200 764" role="img" aria-labelledby="title description">
  <title id="title">LobeHub: a real conversion with Etymon 0.1.1</title>
  <desc id="description">Tracked setup before and after a local conversion of LobeHub 4bcb808c608ed79497713ab20bcd03ac6d8713da. Etymon registered 50 skills and 4 rules under .agents. Skill symlinks and imported instruction files were explicitly retired after verified conversion. Workflow prompts in .claude, reference documentation in .cursor, and .github CI remain tracked. Generated native setup stays local.</desc>
  <style>
    :root { --page: #0d1117; --panel: #0d1117; --subtle: #151b23; --border: #3d444d; --text: #f0f6fc; --muted: #b1bac4; --folder: #4493f8; --link: #79c0ff; --success: #56d364; --selected: #12261b; }
    text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .heading { font-size: 30px; font-weight: 650; }
    .subtitle { fill: var(--muted); font-size: 20px; }
    .panel { fill: var(--panel); stroke: var(--border); }
    .subtle { fill: var(--subtle); stroke: var(--border); }
    .subtle-fill { fill: var(--subtle); }
    .line { fill: none; stroke: var(--border); }
    .stroke { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .repository { fill: var(--link); font-size: 22px; }
    .branch, .column { font-size: 19px; }
    .column { font-weight: 600; }
    .filename { font-size: 24px; }
    .detail { fill: var(--muted); font-size: 19px; }
    .retained { fill: var(--muted); }
    .success { fill: var(--success); }
    .breadcrumb { fill: var(--link); font-size: 21px; font-weight: 600; }
    .footnote { fill: var(--muted); font-size: 19px; }
  </style>
